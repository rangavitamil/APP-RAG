<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CyberSafe RAG</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at top left, #16285c, transparent 35%),
                radial-gradient(circle at bottom right, #30145e, transparent 35%),
                #050817;

            color: white;
            padding: 25px;
        }

        .container {
            max-width: 1200px;
            margin: auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 20px 25px;
            margin-bottom: 25px;

            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 18px;

            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(15px);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .logo span {
            color: #00eaff;
        }

        .status {
            padding: 8px 15px;
            border-radius: 20px;
            background: rgba(0,255,180,0.12);
            color: #00ffb7;
            font-size: 13px;
        }

        .grid {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 20px;
        }

        .card {
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 25px;

            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
